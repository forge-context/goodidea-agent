[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "goodidea-agent"
version = "0.1.0"
description = "An evidence-backed product guidance agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "langgraph>=1.2,<2",
  "pydantic>=2.12,<3",
  "tavily-python>=0.7,<1",
  "uvicorn>=0.39,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/goodidea_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
